<svg width="760" height="190" viewBox="0 0 760 190"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Green CRT glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- CRT scanlines -->
    <pattern id="scanlines"
             width="4"
             height="4"
             patternUnits="userSpaceOnUse">

      <rect width="4"
            height="2"
            fill="#33FF33"
            opacity="0.035"/>
    </pattern>

    <!-- Screen vignette -->
    <radialGradient id="screen">
      <stop offset="0%" stop-color="#071007"/>
      <stop offset="75%" stop-color="#020502"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

  </defs>


  <!-- ========================= -->
  <!-- CRT SCREEN                 -->
  <!-- ========================= -->

  <rect
    width="760"
    height="190"
    rx="8"
    fill="url(#screen)"
  />

  <!-- Scanlines -->
  <rect
    width="760"
    height="190"
    fill="url(#scanlines)"
  />


  <!-- ========================= -->
  <!-- TERMINAL HEADER            -->
  <!-- ========================= -->

  <g
    fill="#33FF33"
    font-family="monospace"
    font-size="14"
    filter="url(#glow)"
  >

    <text x="22" y="25">
      ERIC@GITHUB:~$
    </text>

    <text x="600" y="25">
      [ONLINE]
    </text>

  </g>


  <!-- Separator -->
  <line
    x1="20"
    y1="34"
    x2="740"
    y2="34"
    stroke="#33FF33"
    stroke-opacity="0.35"
  />


  <!-- ========================= -->
  <!-- TERMINAL TEXT              -->
  <!-- ========================= -->

  <g
    fill="#33FF33"
    font-family="monospace"
    font-size="19"
    filter="url(#glow)"
  >

    <text x="22" y="67">
      &gt;_ Welcome to my profile!
    </text>

    <text x="22" y="97">
      &gt;_ My name is Eric.
    </text>

    <text x="22" y="127">
      &gt;_ I am a software engineering student.
    </text>

    <text x="22" y="157">
      &gt;_ I like programming and customizing my Linux environment.
    </text>

  </g>


  <!-- ========================= -->
  <!-- BLINKING CURSOR            -->
  <!-- ========================= -->

  <rect
    x="22"
    y="166"
    width="11"
    height="18"
    fill="#33FF33"
    filter="url(#glow)"
  >

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ========================= -->
  <!-- CRT BORDER                 -->
  <!-- ========================= -->

  <rect
    x="2"
    y="2"
    width="756"
    height="186"
    rx="8"
    fill="none"
    stroke="#33FF33"
    stroke-opacity="0.2"
  />

</svg>
